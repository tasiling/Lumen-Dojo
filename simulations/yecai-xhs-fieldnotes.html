<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>野採｜截圖逐段回看試作</title></head><body><div id="xhs-forage-walkthrough" class="viz-dotted-background" lang="zh-Hant">
  <section class="xf-sheet" aria-label="野採圖文逐段回看的操作示範">
    <header class="xf-head">
      <div><small>行光道場</small><h2>野採</h2></div>
      <span>操作示範</span>
    </header>
    <nav class="xf-nav" aria-label="野採工作區">
      <button type="button" data-mode="inbox" aria-pressed="true">一般採集匣</button>
      <button type="button" data-mode="review" aria-pressed="false">回看所拾</button>
    </nav>
    <div id="xf-inbox" class="xf-content">
      <div class="xf-listhead"><h3>小紅書收藏</h3><small>2 則・5 張截圖</small></div>
      <div id="xf-records"></div>
      <small class="xf-foot">試作範例使用兩則自寫素材及五張示意圖。</small>
    </div>
    <div id="xf-review" class="xf-content" hidden>
      <div class="xf-source">
        <label for="xf-source-choice">正在回看的收藏</label>
        <select id="xf-source-choice"></select>
        <small id="xf-source-meta"></small>
      </div>
      <nav id="xf-pager" class="xf-pages" aria-label="切換原圖"></nav>
      <figure class="xf-figure">
        <figcaption><span id="xf-crop-label">原圖局部</span><button id="xf-zoom" type="button" aria-pressed="false">看完整截圖</button></figcaption>
        <div class="xf-stage" id="xf-stage"><img id="xf-image" alt=""><span id="xf-mark-box" hidden></span></div>
      </figure>
      <div class="xf-text">
        <label for="xf-line">圖中文字</label>
        <select id="xf-line"></select>
        <p id="xf-transcript" lang="zh-Hans"></p>
        <div id="xf-other" class="xf-links"></div>
      </div>
      <div class="xf-annot">
        <button class="xf-main" id="xf-pin" type="button" aria-pressed="false">標記這段</button>
        <button type="button" id="xf-note-button" aria-expanded="false" aria-controls="xf-note-editor">寫下自己的話</button>
      </div>
      <div id="xf-note-editor" hidden>
        <label for="xf-note-target">這句話想留在哪裡</label>
        <select id="xf-note-target"><option value="part">這段原文旁</option><option value="whole">整篇收藏旁</option></select>
        <label for="xf-note">我的話</label>
        <textarea rows="2" id="xf-note" placeholder="可以先留白"></textarea>
        <small>試寫內容只保留在這次開啟的示範裡。</small>
      </div>
      <div id="xf-saved" hidden><h3>這篇的回看紀錄</h3><div id="xf-saved-items"></div></div>
    </div>
    <span id="xf-live" role="status" aria-live="polite" class="xf-sr"></span>
  </section>
</div>
<style>
  #xhs-forage-walkthrough{color-scheme:light dark;--xf-paper:light-dark(#fffcf5,#25221d);--xf-ink:light-dark(#362b21,#f8ecdc);--xf-sub:light-dark(#6c6051,#cdbda8);--xf-line:light-dark(#dbd1bf,#51483b);--xf-fill:light-dark(#f5eedf,#302b23);--xf-honey:light-dark(#79532d,#e3bd8f);--xf-action:light-dark(#694829,#eed3b3);--xf-on-action:light-dark(#fffbf2,#332417);--xf-focal:light-dark(#a45f17,#eea850);padding:8px 4px;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5;color:var(--xf-ink)}
  #xhs-forage-walkthrough *{box-sizing:border-box}
  #xhs-forage-walkthrough [hidden]{display:none!important}
  #xhs-forage-walkthrough .xf-sheet{margin:auto;max-width:620px;min-width:0;background:var(--xf-paper);border:1px solid var(--xf-line);border-radius:14px;overflow:hidden}
  #xhs-forage-walkthrough h2,#xhs-forage-walkthrough h3,#xhs-forage-walkthrough p,#xhs-forage-walkthrough figure{margin:0}
  #xhs-forage-walkthrough h2,#xhs-forage-walkthrough h3{color:var(--xf-ink);font-family:"Songti TC","Noto Serif TC","PMingLiU",serif}
  #xhs-forage-walkthrough h2{font-size:28px;line-height:1.25;font-weight:600;letter-spacing:.04em}
  #xhs-forage-walkthrough h3{font-size:19px;line-height:1.45;font-weight:600}
  #xhs-forage-walkthrough small,#xhs-forage-walkthrough .xf-head>span{font-size:12px;color:var(--xf-sub)}
  #xhs-forage-walkthrough button,#xhs-forage-walkthrough select,#xhs-forage-walkthrough textarea{font:inherit;color:var(--xf-ink)}
  #xhs-forage-walkthrough button{appearance:none;background:none;border:0;min-height:42px;line-height:1.35;padding:6px 9px;border-radius:6px;text-align:center}
  #xhs-forage-walkthrough button:focus-visible,#xhs-forage-walkthrough select:focus-visible,#xhs-forage-walkthrough textarea:focus-visible{outline:2px solid var(--xf-honey);outline-offset:2px}
  #xhs-forage-walkthrough button:hover{background:var(--xf-fill)}
  #xhs-forage-walkthrough select,#xhs-forage-walkthrough textarea{width:100%;min-width:0;border-radius:6px;border:1px solid var(--xf-line);background:var(--xf-paper);padding:9px 8px;font-size:16px}
  #xhs-forage-walkthrough .xf-source select,#xhs-forage-walkthrough #xf-line{font-weight:550}
  #xhs-forage-walkthrough .xf-source label,#xhs-forage-walkthrough .xf-text>label,#xhs-forage-walkthrough #xf-note-editor label{display:block;margin:0 0 5px;color:var(--xf-sub);font-size:13px}
  #xhs-forage-walkthrough .xf-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 24px 9px}
  #xhs-forage-walkthrough .xf-head>span{margin-right:58px}
  #xhs-forage-walkthrough .xf-nav{display:flex;gap:20px;border-bottom:1px solid var(--xf-line);padding:0 24px}
  #xhs-forage-walkthrough .xf-nav button{border-radius:0;padding:9px 1px;border-bottom:2px solid transparent;color:var(--xf-sub);font-size:15px}
  #xhs-forage-walkthrough .xf-nav button[aria-pressed="true"]{color:var(--xf-honey);border-bottom-color:var(--xf-honey);font-weight:650}
  #xhs-forage-walkthrough .xf-content{padding:16px 24px 18px}
  #xhs-forage-walkthrough .xf-listhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:3px}
  #xhs-forage-walkthrough .xf-entry{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--xf-line)}
  #xhs-forage-walkthrough .xf-thumb{width:76px;aspect-ratio:3/4;object-fit:cover;object-position:50% 17%;border:1px solid var(--xf-line);border-radius:4px;background:var(--xf-fill)}
  #xhs-forage-walkthrough .xf-entry h4{font:600 17px/1.42 "PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow-wrap:anywhere;margin:2px 0 3px;color:var(--xf-ink)}
  #xhs-forage-walkthrough .xf-entry-actions,.xf-pages,.xf-annot,#xhs-forage-walkthrough .xf-links{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  #xhs-forage-walkthrough .xf-entry-actions{margin-top:3px}
  #xhs-forage-walkthrough .xf-entry-actions button,.xf-pages button{padding-inline:8px;color:var(--xf-honey);font-size:14px}
  #xhs-forage-walkthrough .xf-entry-actions button:first-child{margin-left:-7px}
  #xhs-forage-walkthrough .xf-foot{display:block;margin-top:12px}
  #xhs-forage-walkthrough .xf-source small{display:block;margin-top:5px}
  #xhs-forage-walkthrough .xf-pages{margin:10px 0 8px;gap:5px}
  #xhs-forage-walkthrough .xf-pages button[aria-pressed="true"]{background:var(--xf-fill);color:var(--xf-ink);box-shadow:inset 0 0 0 1px var(--xf-line)}
  #xhs-forage-walkthrough .xf-figure{background:var(--xf-fill);padding:4px 11px 11px;border-radius:8px}
  #xhs-forage-walkthrough figcaption{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--xf-sub)}
  #xhs-forage-walkthrough figcaption button,#xhs-forage-walkthrough .xf-links button,#xhs-forage-walkthrough #xf-note-button{color:var(--xf-honey);text-decoration:underline;text-underline-offset:3px}
  #xhs-forage-walkthrough .xf-stage{position:relative;overflow:hidden;margin:0 auto;max-width:100%;background:var(--xf-paper);border-radius:4px}
  #xhs-forage-walkthrough .xf-stage img{position:absolute;max-width:none;max-height:none;display:block}
  #xhs-forage-walkthrough #xf-mark-box{position:absolute;outline:2px solid var(--xf-focal);outline-offset:1px;border-radius:2px;pointer-events:none}
  #xhs-forage-walkthrough .xf-text{margin-top:14px}
  #xhs-forage-walkthrough #xf-transcript{padding:9px 0 2px;font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
  #xhs-forage-walkthrough .xf-links{font-size:13px;color:var(--xf-sub)}
  #xhs-forage-walkthrough .xf-links button{font-size:13px}
  #xhs-forage-walkthrough .xf-annot{margin-top:10px;gap:8px}
  #xhs-forage-walkthrough button.xf-main{background:var(--xf-action);color:var(--xf-on-action);padding:9px 16px}
  #xhs-forage-walkthrough button.xf-main[aria-pressed="true"]{background:var(--xf-fill);color:var(--xf-honey);box-shadow:inset 0 0 0 1px var(--xf-line)}
  #xhs-forage-walkthrough #xf-note-editor,#xhs-forage-walkthrough #xf-saved{border-top:1px solid var(--xf-line);margin-top:15px;padding-top:13px}
  #xhs-forage-walkthrough #xf-note-editor label:not(:first-child){margin-top:8px}
  #xhs-forage-walkthrough textarea{resize:vertical;display:block}
  #xhs-forage-walkthrough #xf-note-editor small{display:block;margin-top:5px}
  #xhs-forage-walkthrough #xf-saved h3{font-size:16px}
  #xhs-forage-walkthrough .xf-saved-row{padding:7px 0;border-bottom:1px solid var(--xf-line)}
  #xhs-forage-walkthrough .xf-saved-row:last-child{border:0}
  #xhs-forage-walkthrough .xf-saved-row button{display:block;text-align:left;color:var(--xf-honey);padding-left:0;overflow-wrap:anywhere;font-size:14px}
  #xhs-forage-walkthrough .xf-saved-row p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  #xhs-forage-walkthrough .xf-sr{position:absolute!important;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  @media(max-width:440px){#xhs-forage-walkthrough .xf-head{padding:14px 14px 8px}#xhs-forage-walkthrough .xf-nav{padding:0 14px}#xhs-forage-walkthrough .xf-content{padding:13px 14px 15px}#xhs-forage-walkthrough .xf-entry{grid-template-columns:55px minmax(0,1fr);gap:10px}#xhs-forage-walkthrough .xf-thumb{width:55px}#xhs-forage-walkthrough .xf-entry-actions{gap:0}}
  @media(pointer:coarse){#xhs-forage-walkthrough button,#xhs-forage-walkthrough select{min-height:44px}}
</style>

  const get=id=>root.querySelector('#xf-'+id);
  const pageById=new Map(data.pages.map(page=>[page.id,page]));
  const notes=new Map(),pins=new Set();
  let mode='inbox', post=data.posts[0],page=pageById.get('topics'),idx=page.default,full=false,scope='part';
  const elem=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
  function button(text,action,label){

  const remembered=k=>pins.has(k)||Boolean(notes.get(k));
  function count(item){let n=0;for(const id of item.pages){const p=pageById.get(id);p.lines.forEach((_,i)=>{if(remembered(key(p,i)))n++})}return n}
  function buildInbox(){
    const list=get('records');list.replaceChildren();
    for(const item of data.posts){
      const first=pageById.get(item.pages[0]);
      const article=elem('article',undefined,'xf-entry');
      const thumb=elem('img',undefined,'xf-thumb');thumb.alt='';thumb.src=first.image;
      const content=elem('div'),author=elem('small',item.author);
      const title=elem('h4',item.title),n=count(item);
      const info=elem('small',item.pages.length+' 張截圖'+(n?'・已留 '+n+' 段':'')+(notes.get('whole-'+item.id)?'・有自己的話':''));
      const actions=elem('div',undefined,'xf-entry-actions');actions.setAttribute('aria-label','回看這篇的原圖');
      for(const id of item.pages){
        const p=pageById.get(id);
        actions.append(button(p.id==='social'?'看第 05 頁':p.tab,()=>openPage(item,p.id),item.title+'，回看'+pageLabel(p,item)));

      content.append(author,title,info,actions);article.append(thumb,content);list.append(article);
    }

  function openPage(item,id,line,showAll=false){
    post=item;page=pageById.get(id);idx=line===undefined?page.default:line;

  function setMode(value){
    mode=value;

    get('inbox').hidden=mode!=='inbox';get('review').hidden=mode!=='review';
    if(mode==='inbox'){buildInbox();get('live').textContent='一般採集匣，共兩則收藏。'}
    else renderReview();
  }
  function renderFrame(){
    const image=get('image'),stage=get('stage'),mark=get('mark-box'),selected=page.lines[idx];
    const [x,y,right,bottom]=selected.box;

    const x0=full?0:Math.max(0,x-pad),y0=full?0:Math.max(0,y-pad);

    stage.style.width=full?'min(100%, 300px)':'100%';
    stage.style.aspectRatio=w+' / '+h;
    image.src=page.image;image.alt=pageLabel(page,post)+'，'+(full?'完整截圖，標出':'原圖局部，')+selected.name;
    image.style.width=(page.width/w*100)+'%';image.style.height=(page.height/h*100)+'%';
    image.style.left=(-x0/w*100)+'%';image.style.top=(-y0/h*100)+'%';
    mark.hidden=!full;
    mark.style.left=x/page.width*100+'%';mark.style.top=y/page.height*100+'%';
    mark.style.width=(right-x)/page.width*100+'%';mark.style.height=(bottom-y)/page.height*100+'%';
    get('crop-label').textContent=pageLabel(page,post)+' · '+(full?'完整截圖':'原圖局部');
    get('zoom').textContent=full?'看這段局部':'看完整截圖';get('zoom').setAttribute('aria-pressed',String(full));

  function renderRemembered(){

    for(const id of post.pages){
      const p=pageById.get(id);
      p.lines.forEach((l,i)=>{
        const k=key(p,i);if(!remembered(k))return;
        const row=elem('div',undefined,'xf-saved-row');
        const location=pageLabel(p,post)+' · '+ordinal(p,i);
        row.append(button(location+' ↗',()=>openPage(post,id,i,true),'回到原圖，'+location+'，'+l.name));
        row.append(elem('p',l.name+'　'+l.text));
        if(notes.get(k)){const note=elem('p');note.append(elem('small','我的話　'),document.createTextNode(notes.get(k)));row.append(note)}
        rows.push(row);
      });
    }
    list.append(...rows);get('saved').hidden=rows.length===0;
  }
  function renderNote(){
    get('note-target').value=scope;get('note').value=notes.get(activeKey())||'';

  function renderReview(){
    get('source-choice').value=post.id;

    const ln=page.lines[idx];

    for(const id of post.pages.filter(id=>id!==page.id)){
      const p=pageById.get(id),i=p.lines.findIndex(l=>l.name===ln.name);

      if(!links.childNodes.length)links.append(elem('span','同一篇也出現在'));
      links.append(button(p.tab+' · 第 '+(i+1)+' 項',()=>openPage(post,id,i)));
    }
    renderFrame();renderPin();renderNote();renderRemembered();
    get('live').textContent=pageLabel(page,post)+'，'+ln.name;
  }

  sources.addEventListener('change',()=>{const p=data.posts.find(s=>s.id===sources.value);openPage(p,p.pages[0])});
  get('line').addEventListener('change',e=>openPage(post,page.id,Number(e.target.value),full));
  get('zoom').addEventListener('click',()=>{full=!full;renderFrame()});
  get('pin').addEventListener('click',()=>{
    const k=key(page,idx);if(pins.has(k))pins.delete(k);else pins.add(k);
    renderPin();renderRemembered();get('live').textContent=pins.has(k)?'已在本次示範標記這段原文。':'已取消標記。';
  });
  get('note-button').addEventListener('click',()=>{
    get('note-editor').hidden=!get('note-editor').hidden;renderNote();

  });
  get('note-target').addEventListener('change',e=>{scope=e.target.value;renderNote()});
  get('note').addEventListener('input',e=>{const k=activeKey();if(e.target.value.trim())notes.set(k,e.target.value);else notes.delete(k);renderRemembered()});

  root.querySelectorAll('button,select').forEach(el=>el.classList.add('cursor-interaction'));
  buildInbox();
